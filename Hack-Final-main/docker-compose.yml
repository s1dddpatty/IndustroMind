# ── ET-Hack-Backend Docker Compose ──
# Infrastructure: PostgreSQL, Redis, and the backend service.
# Neo4j is required by the AI modules — uncomment when needed.

services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://neuroplant:neuroplant@postgres:5432/neuroplant
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      # neo4j:
      #   condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: neuroplant
      POSTGRES_PASSWORD: neuroplant
      POSTGRES_DB: neuroplant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuroplant"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Neo4j (Uncomment when Person 2 AI modules are active) ──
  # neo4j:
  #   image: neo4j:5-community
  #   environment:
  #     NEO4J_AUTH: neo4j/password
  #   ports:
  #     - "7474:7474"   # Browser UI
  #     - "7687:7687"   # Bolt protocol
  #   volumes:
  #     - neo4jdata:/data

volumes:
  pgdata:
  # neo4jdata:
